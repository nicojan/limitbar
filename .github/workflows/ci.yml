name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: swiftc --version
      - run: ./test.sh
      - run: LIMITBAR_OUT=.build ./build.sh
      # The release build: Sparkle linked in, ad-hoc signed, not notarized. Proves the updater code compiles and loads.
      - run: SIGN_ID=- NOTARY_PROFILE= OUT=.build/release release/release.sh
      - run: |
          v="$(.build/release/Limitbar.app/Contents/MacOS/Limitbar --version)"; echo "$v"
          case "$v" in *"no updater"*) echo "release build is missing Sparkle"; exit 1;; esac
